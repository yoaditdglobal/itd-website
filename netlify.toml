# Netlify build configuration.
# Keeps Deploy Previews (per pull request) building identically to production.
# Netlify auto-applies the Next.js runtime, so no publish dir / plugin block is needed here.

[build]
  command = "next build"

[build.environment]
  # Pin the Node version so local machines and Netlify build the same way.
  # Matches .nvmrc. Node 20 reached EOL on 30 Apr 2026; targeting Node 22 LTS.
  NODE_VERSION = "22"

# Production = the `main` branch (Netlify deploys this to the live site).
# Deploy Previews are generated automatically for every pull request opened
# against `main` — confirm this is enabled under:
#   Site configuration → Build & deploy → Deploy contexts → Deploy Previews.

# Peak report PDFs (public/reports/*): soft-gated downloads. Keep them out of
# search so the PDF can't rank and bypass the /peak lead form; open inline in
# the browser; cache for a year (filenames change per edition).
[[headers]]
  for = "/reports/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Disposition = "inline"
